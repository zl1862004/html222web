/* ============ 音效（原生合成，零外链） ============ */
class SoundFx {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  }
  play(freq, type, duration, gainVal) {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal || 0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) { /* 音效异常不影响主流程 */ }
  }
  click() { this.play(440, 'sine', 0.07, 0.08); }
  flip()  { this.play(620, 'sine', 0.06, 0.07); }
  match(combo) {
    const step = Math.min(combo, 8);
    this.play(523.25 * Math.pow(1.12, step), 'triangle', 0.24, 0.18);
    setTimeout(() => this.play(523.25 * Math.pow(1.12, step + 2), 'sine', 0.22, 0.13), 60);
  }
  wrong() {
    this.play(180, 'sawtooth', 0.22, 0.16);
    setTimeout(() => this.play(140, 'sawtooth', 0.2, 0.16), 80);
  }
  win() {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      setTimeout(() => this.play(f, 'triangle', 0.32, 0.18), i * 100);
    });
  }
  lose() {
    [392, 330, 262, 196].forEach((f, i) => {
      setTimeout(() => this.play(f, 'sawtooth', 0.32, 0.16), i * 130);
    });
  }
}

    this.currentLevel = 1;
    this.cards = [];
    this.selectedCards = [];
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.matchedPairs = 0;
    this.totalPairs = 0;
    this.elapsed = 0;
    this.remaining = 70;
    this.timeLimit = 70;
    this.timerInterval = null;
    this.isLocked = false;
    this.gameOver = false;
    this.memoryMode = false;
    this.modalNextLevel = 1;
  }

  /* ---------- 初始化关卡 ---------- */
  initLevel(level) {
    if (typeof level === 'number') this.currentLevel = level;
    const cfg = LEVEL_CONFIG[this.currentLevel];

    this.clearTimer();
    this.gameOver = false;
    this.isLocked = false;
    this.selectedCards = [];
    this.combo = 0;
    this.maxCombo = 0;
    this.matchedPairs = 0;
    this.score = 0;
    this.elapsed = 0;
    this.memoryMode = cfg.memory;
    this.timeLimit = cfg.limit;
    this.remaining = cfg.limit;

    document.getElementById('valLevel').textContent = cfg.name;
    document.getElementById('knowContent').textContent = cfg.memory
      ? '记忆翻牌：卡片背面朝上，翻开两张同一元素的卡片才能消除！'
      : '限时挑战！点击两张相互匹配的卡片即可消除，配错扣 20 分并扣 3 秒。';

    // 选取元素池
    let pool;
    if (cfg.pool === 'first10') {
      pool = ELEMENTS_DB.slice(0, 10);
    } else if (cfg.pool === 'second10') {
      pool = ELEMENTS_DB.slice(10, 20);
    } else {
      pool = [...ELEMENTS_DB];
      this.shuffle(pool);
      pool = pool.slice(0, 12);
    }

    // 生成卡片
    const cardsData = [];
    pool.forEach((elem) => {
      let types;
      if (cfg.reprMode === 'mixed') {
        const all = ['symbol', 'name', 'number'];
        this.shuffle(all);
        types = all.slice(0, 2);
      } else {
        types = ['symbol', 'name'];
      }
      types.forEach((t) => cardsData.push(this.buildCard(elem, t)));
    });

    this.totalPairs = pool.length;
    this.shuffle(cardsData);
    this.cards = cardsData;

    this.renderBoard();
    this.updateStats();
    this.updateTimerUI();
    this.startTimer();
  }

  /* ---------- 构造单张卡片 ---------- */
  buildCard(elem, cardType) {
    let displayMain = '', displaySub = '', tagName = '';
    if (cardType === 'symbol') {
      displayMain = elem.symbol;
      displaySub = '元素符号';
      tagName = '符号';
    } else if (cardType === 'name') {
      displayMain = elem.name;
      displaySub = '元素名称';
      tagName = '中文';
    } else {
      displayMain = String(elem.z);
      displaySub = '原子序数';
      tagName = '序数';
    }
    return {
      elemZ: elem.z,
      cardType: cardType,
      displayMain: displayMain,
      displaySub: displaySub,
      tagName: tagName,
      elemData: elem
    };
  }

  /* ---------- 渲染棋盘 ---------- */
  renderBoard() {
    const board = document.getElementById('gridBoard');
    board.innerHTML = '';
    const n = this.cards.length;
    board.className = 'grid-board ' + (n <= 20 ? 'grid-4x5' : 'grid-6x4');

    this.cards.forEach((item, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'chem-card type-' + item.elemData.type + (this.memoryMode ? ' face-down' : '');
      cardEl.dataset.index = index;

      cardEl.innerHTML =
        '<span class="card-type-tag">' + item.tagName + '</span>' +
        '<span class="card-category-dot dot-' + item.elemData.type + '"></span>' +
        '<div class="card-main-val">' + item.displayMain + '</div>' +
        '<div class="card-sub-info">' + item.displaySub + '</div>';

      cardEl.addEventListener('click', () => this.handleCardClick(index, cardEl));
      board.appendChild(cardEl);
    });
  }

  /* ---------- 点击卡片 ---------- */
  handleCardClick(index, cardEl) {
    if (this.isLocked || this.gameOver) return;
    if (cardEl.classList.contains('matched')) return;
    if (cardEl.classList.contains('selected')) return;

    if (cardEl.classList.contains('face-down')) {
      cardEl.classList.remove('face-down');
      sfx.flip();
    } else {
      sfx.click();
    }

    cardEl.classList.add('selected');
    const cardData = this.cards[index];
    this.selectedCards.push({ index: index, el: cardEl, data: cardData });

    // 知识点提示
    const elem = cardData.elemData;
    const typeCn = elem.type === 'nonmetal' ? '非金属元素' : (elem.type === 'metal' ? '金属元素' : '稀有气体');
    document.getElementById('knowContent').innerHTML =
      '<strong>' + elem.z + '号 ' + elem.name + '（' + elem.symbol + '）</strong>：' + typeCn + '，' + elem.desc;

    if (this.selectedCards.length === 2) this.checkMatch();
  }

  /* ---------- 判定匹配 ---------- */
  checkMatch() {
    this.isLocked = true;
    const c1 = this.selectedCards[0];
    const c2 = this.selectedCards[1];

    if (c1.data.elemZ === c2.data.elemZ && c1.index !== c2.index) {
      /* --- 匹配成功 --- */
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;

      const bonus = this.currentLevel >= 4 ? 1.5 : (this.currentLevel === 3 ? 1.2 : 1);
      this.score += Math.round((100 + (this.combo - 1) * 30) * bonus);
      this.matchedPairs++;

      sfx.match(this.combo);
      if (this.combo >= 2) this.showPopup('comboPopup', 'COMBO x' + this.combo + '!');

      setTimeout(() => {
        c1.el.classList.remove('selected');
        c2.el.classList.remove('selected');
        c1.el.classList.add('matched');
        c2.el.classList.add('matched');

        this.selectedCards = [];
        this.isLocked = false;
        this.updateStats();

        if (this.matchedPairs >= this.totalPairs) this.handleWin();
      }, 320);

    } else {
      /* --- 匹配失败：扣分 + 扣时 --- */
      this.combo = 0;
      this.score = Math.max(0, this.score - 20);
      this.remaining = Math.max(0, this.remaining - 3);
      sfx.wrong();
      this.showPopup('penaltyPopup', '-20分 / -3秒');
      c1.el.classList.add('wrong');
      c2.el.classList.add('wrong');
      this.updateStats();
      this.updateTimerUI();

      const timeOut = this.remaining <= 0;

      setTimeout(() => {
        c1.el.classList.remove('selected', 'wrong');
        c2.el.classList.remove('selected', 'wrong');
        if (this.memoryMode) {
          c1.el.classList.add('face-down');
          c2.el.classList.add('face-down');
        }
        this.selectedCards = [];
        this.isLocked = false;

        if (timeOut) this.handleLose();
      }, 700);
    }
  }

  showPopup(id, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 600);
  }

  /* ---------- 计分板 ---------- */
  updateStats() {
    document.getElementById('valScore').textContent = this.score;
    document.getElementById('valCombo').textContent = this.combo;
  }

  /* ---------- 倒计时 ---------- */
  startTimer() {
    this.clearTimer();
    this.timerInterval = setInterval(() => {
      if (this.gameOver) return;
      this.remaining--;
      this.elapsed++;
      this.updateTimerUI();
      if (this.remaining <= 0) this.handleLose();
    }, 1000);
  }

  clearTimer() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
  }

  updateTimerUI() {
    const r = Math.max(0, this.remaining);
    const m = String(Math.floor(r / 60)).padStart(2, '0');
    const s = String(r % 60).padStart(2, '0');
    const timerEl = document.getElementById('valTimer');
    timerEl.textContent = m + ':' + s;
    timerEl.classList.toggle('time-warning', r <= 20 && r > 10);
    timerEl.classList.toggle('time-danger', r <= 10);

    const bar = document.getElementById('timerBar');
    const pct = this.timeLimit > 0 ? Math.max(0, (r / this.timeLimit) * 100) : 0;
    bar.style.width = pct + '%';
    bar.classList.toggle('warning', pct <= 35 && pct > 15);
    bar.classList.toggle('danger', pct <= 15);
  }

  /* ---------- 结算 ---------- */
  handleWin() {
    if (this.gameOver) return;
    this.gameOver = true;
    this.isLocked = true;
    this.clearTimer();
    sfx.win();

    const cfg = LEVEL_CONFIG[this.currentLevel];
    document.getElementById('resultCard').classList.remove('lose');
    document.getElementById('resIcon').textContent = '🎉';
    document.getElementById('resTitle').textContent = '挑战成功！';
    document.getElementById('resDesc').textContent =
      '你已通过「' + cfg.title + '」，剩余 ' + this.remaining + ' 秒。';

    let rank = '化学新星 ✨';
    if (this.score >= 2000) rank = '元素大师 👑';
    else if (this.score >= 1400) rank = '化学学霸 🌟';
    else if (this.score >= 900) rank = '化学能手 💪';
    document.getElementById('resRank').textContent = rank;

    this.modalNextLevel = this.currentLevel >= 4 ? 1 : this.currentLevel + 1;
    document.getElementById('resPrimaryBtn').textContent =
      this.currentLevel >= 4 ? '从头再来' : '下一关（更难）';

    this.fillResultStats();
    document.getElementById('resultModal').classList.add('active');
  }

  handleLose() {
    if (this.gameOver) return;
    this.gameOver = true;
    this.isLocked = true;
    this.clearTimer();
    sfx.lose();

    document.getElementById('resultCard').classList.add('lose');
    document.getElementById('resIcon').textContent = '⏰';
    document.getElementById('resTitle').textContent = '时间耗尽！';
    document.getElementById('resDesc').textContent =
      '还差 ' + (this.totalPairs - this.matchedPairs) + ' 对没消完，再挑战一次吧！';
    document.getElementById('resRank').textContent = '再接再厉 🔥';

    this.modalNextLevel = this.currentLevel;
    document.getElementById('resPrimaryBtn').textContent = '再试一次';

    this.fillResultStats();
    document.getElementById('resultModal').classList.add('active');
  }

  fillResultStats() {
    const m = String(Math.floor(this.elapsed / 60)).padStart(2, '0');
    const s = String(this.elapsed % 60).padStart(2, '0');
    document.getElementById('resScore').textContent = this.score;
    document.getElementById('resTime').textContent = m + ':' + s;
    document.getElementById('resCombo').textContent = this.maxCombo + ' 连击';
  }

  modalPrimary() {
    this.closeModal();
    this.switchLevel(this.modalNextLevel);
  }

  closeModal() {
    document.getElementById('resultModal').classList.remove('active');
  }

  /* ---------- 关卡切换 ---------- */
  switchLevel(lvl) {
    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.classList.toggle('active', parseInt(btn.dataset.level, 10) === lvl);
    });
    this.initLevel(lvl);
  }

  /* ---------- 洗牌 ---------- */
  shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = array[i];
      array[i] = array[j];
      array[j] = tmp;
    }
    return array;
  }
}

const game = new ElementGame();
window.addEventListener('DOMContentLoaded', () => {
  game.initLevel(1);
});
</script>
