<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello, Web</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    background:radial-gradient(circle at 25% 15%,#eef2ff,#fafaf7 62%);
    color:#14140f;
  }
  .card{
    max-width:440px;padding:48px 44px;border-radius:20px;background:#fff;
    border:1px solid #e8e8e2;text-align:center;
    box-shadow:0 24px 70px -34px rgba(20,20,15,.4);
  }
  h1{margin:0 0 14px;font-size:28px;letter-spacing:-.025em;font-weight:650}
  p{margin:0 0 6px;color:#7c7c74;font-size:14.5px;line-height:1.75}
  .tag{
    display:inline-flex;align-items:center;gap:7px;margin-bottom:22px;
    padding:5px 12px;border-radius:999px;background:#e7f5ee;color:#0f7a4d;
    font-size:12px;font-weight:600;letter-spacing:.02em;
  }
  .tag i{width:6px;height:6px;border-radius:50%;background:currentColor}
</style>
</head>
<body>
  <div class="card">
    <div class="tag"><i></i>READY TO SHIP</div>
    <h1>Hello, Web</h1>
    <p>左边改代码，右边即时预览。</p>
    <p>点右上角「发布上线」，它就会变成一个真实的网址。</p>
  </div>
</body>
</html>
